name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Apple Silicon. Tests that need an installed environment, a model, Hugging
    # Face or a second Mac are skipped here, as anywhere their MODELLAB_TEST_*
    # variable is not set.
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the command line supports, and the one its environments use.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv run --no-project --python ${{ matrix.python }} --with pytest --with numpy --with pillow python -m pytest tests
